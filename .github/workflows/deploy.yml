name: Deploy to Homelab

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after building (false verifies the runner without changing the site)
        type: boolean
        default: true
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: kesku-me-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      HUSKY: "0"
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Test atomic deployment and rollback
        run: python3 -m unittest discover -s tests -p 'test_deploy.py' -v

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_OPTIONS: --max-old-space-size=384
        run: nice -n 10 ionice -c 3 bun run build

      - name: Publish and verify release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        run: >-
          python3 scripts/deploy.py publish
          --release "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
